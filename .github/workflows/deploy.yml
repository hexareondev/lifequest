# Проверка, сборка и выкладка на GitHub Pages при каждом обновлении ветки main.
# Если npm run check находит проблему, выкладки нет — на сайте остаётся прошлая рабочая версия.
name: Выкладка на Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # кнопка ручного запуска во вкладке Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
